<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Colour flipper</title>
</head>
<body>
    <!-- This project develops a simple colour flipper -->

    <header class="head">
        <nav>
            <p class="flipper-text">Colour flipper</p>
            <p class="simple-option txt txt-active">Simple</p>
            <p class="hex-option txt">Hex</p>
        </nav>
    </header>

    <main>
        <section class="bg-color-text-con">
            <p class="bg-color-text">
                Background Color: <span class="bg-color-value"></span>
            </p>
        </section>

        <section class="bg-color-btn-con">
            <button class="change-color-btn">Change colour</button>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
